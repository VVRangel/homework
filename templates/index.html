<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#667eea,#764ba2);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:500px;
    max-width:95%;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 15px 35px rgba(0,0,0,0.3);
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:#333;
}

form{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

input{
    flex:1;
    padding:12px;
    border:2px solid #ddd;
    border-radius:10px;
    font-size:16px;
}

button{
    padding:12px 18px;
    border:none;
    border-radius:10px;
    background:#667eea;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    opacity:0.9;
}

.task{
    background:#f4f4f4;
    padding:15px;
    border-radius:12px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.actions{
    display:flex;
    gap:8px;
}

.edit{
    background:#3b82f6;
    color:white;
    padding:7px 10px;
    border-radius:8px;
    text-decoration:none;
}

.edit:hover{
    background:#2563eb;
}

.delete{
    background:#ef4444;
    color:white;
    padding:7px 10px;
    border-radius:8px;
    text-decoration:none;
}

.delete:hover{
    background:#dc2626;
}

.empty{
    text-align:center;
    color:gray;
    margin-top:20px;
}
</style>

</head>
<body>

<div class="container">

    <h1>📝 To-Do List</h1>

    <form method="POST">
        <input type="text" name="task" placeholder="Enter task..." required>
        <button type="submit">Add</button>
    </form>

    {% if tasks %}
        {% for task in tasks %}
        <div class="task">
            <span>{{ task }}</span>

            <div class="actions">
                <a class="edit" href="/edit/{{ loop.index0 }}">Edit</a>
                <a class="delete" href="/delete/{{ loop.index0 }}">Delete</a>
            </div>
        </div>
        {% endfor %}
    {% else %}
        <p class="empty">No tasks yet 🚀</p>
    {% endif %}

</div>

</body>
</html>
